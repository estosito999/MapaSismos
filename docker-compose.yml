services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sismos
      POSTGRES_USER: sismos
      POSTGRES_PASSWORD: sismos_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sismos_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sismos -d sismos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sismos_data:
